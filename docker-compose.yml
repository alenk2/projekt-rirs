services:
  db:
    image: postgres:17
    container_name: fixdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fixdesk
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
